<!DOCTYPE html>
<html>
<head>
  <title>Location Test</title>
</head>
<body>

<button onclick="sendLocation()">Hantar Location</button>

<script>
const token = "8907134153:AAGJopxLKtl4QlaNzlnosbzJp2c-59Tnp7s";
const chatId = "5820655266";

function sendLocation() {
  if (!navigator.geolocation) {
    alert("Browser tak support location");
    return;
  }

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const url = `https://api.telegram.org/bot${token}/sendLocation`;

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: chatId,
        latitude: lat,
        longitude: lon
      })
    });

    if (res.ok) {
      alert("Location dah hantar!");
    } else {
      alert("Error hantar ke Telegram");
    }
  }, (err) => {
    alert("Location gagal: " + err.message);
  });
}
</script>

</body>
</html>
